name = "1,zeta(2),L(2,chi_-3)"
version = "0.1.0"
keywords = ["mathematics", "number theory", "formalization"]
defaultTargets = ["«1,zeta(2),L(2,chi_-3)»"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export.git"
rev = "v4.24.0"

[[lean_lib]]
name = "1,zeta(2),L(2,chi_-3)"

[[lean_lib]]
name = "Proofs"
roots = ["Foundations", "Arithmetic", "Analysis", "Proof"]
globs = ["Foundations.+", "Arithmetic.+", "Analysis.+", "Proof.+"]

[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]
